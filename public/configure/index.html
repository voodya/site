<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Редактор портфолио</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#e2e8f0}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,calc((100vw - 1480px)/2));background:#111c32;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;gap:16px}h1,h2,h3,p{margin:0}h1{font-size:24px}p{color:#94a3b8;margin-top:6px}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#2563eb;font:inherit;font-weight:650}button:hover{background:#3b82f6}button.secondary,.icon{background:#334155}button.danger{background:#991b1b}button.icon{padding:6px 10px}main{max-width:1480px;margin:0 auto;padding:24px 20px 50px}.workspace{display:grid;grid-template-columns:260px minmax(0,1fr) 350px;gap:18px;margin-top:22px;align-items:start}.panel{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px}.stack{display:grid;gap:12px}.company-nav button{display:block;width:100%;text-align:left;padding:10px;margin-bottom:7px;background:#27364c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.company-nav button.active{outline:2px solid #60a5fa;background:#1d4ed8}.small,.hint{font-size:12px;color:#94a3b8;font-weight:400}.company-nav .small{display:block;margin-top:3px;color:#cbd5e1}label{display:grid;gap:6px;color:#cbd5e1;font-size:13px;font-weight:600}input,textarea{width:100%;border:1px solid #475569;border-radius:8px;padding:9px 10px;background:#020617;color:#f8fafc;font:inherit;font-weight:400}textarea{min-height:90px;resize:vertical;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{display:flex;gap:8px;border-bottom:1px solid #475569;padding-bottom:12px;margin-bottom:16px;overflow:auto}.tabs button.active{background:#1d4ed8}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.array{display:grid;gap:7px;margin-top:8px}.array-row{display:grid;grid-template-columns:1fr auto;gap:7px}.preview{position:sticky;top:16px;overflow:hidden}.preview-hero{display:flex;gap:12px;align-items:center;margin:10px 0 16px}.preview-logo{width:65px;height:65px;border-radius:12px;background:#0f172a;object-fit:cover;border:1px solid #475569}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.badge{padding:4px 8px;font-size:12px;border-radius:99px;background:#172554;color:#bfdbfe;border:1px solid #1d4ed8}.project-preview{margin-top:18px;border-top:1px solid #475569;padding-top:16px}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:#020617;border-radius:9px;border:1px solid #334155}.screens{display:flex;gap:6px;overflow:auto;margin-top:8px}.screens img{width:72px;height:52px;flex:none;object-fit:cover;border-radius:5px;border:1px solid #475569}#status{min-height:22px;margin-top:12px}.success{color:#86efac}.error{color:#fca5a5}[hidden]{display:none!important}@media(max-width:1050px){.workspace{grid-template-columns:230px minmax(0,1fr)}.preview{grid-column:1/-1;position:static}}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.workspace,.grid{grid-template-columns:1fr}.company-nav{max-height:220px;overflow:auto}}
  </style>
</head>
<body>
  <header><div><h1>Редактор портфолио</h1><p>Меняйте карточки — JSON формируется автоматически.</p></div><div class="actions"><button id="save" hidden>Сохранить изменения</button><button id="logout" class="secondary" hidden>Выйти</button></div></header>
  <main>
    <section id="login-panel" class="panel" style="max-width:440px;margin:48px auto"><form id="login-form" class="stack"><h2>Вход</h2><label>Пароль<input id="password" type="password" autocomplete="current-password" required autofocus></label><button>Войти</button></form></section>
    <section id="editor" hidden><p id="status" role="status"></p><div class="workspace"><aside class="panel company-nav"><h2>Компании</h2><div id="companies" class="stack" style="margin-top:12px"></div><button data-action="add-company" style="width:100%;margin-top:10px">+ Добавить компанию</button></aside><section id="form" class="panel"></section><aside id="preview" class="panel preview"></aside></div></section>
  </main>
  <script>
    const $=id=>document.getElementById(id),state={content:[],company:0,project:0,tab:'company'};
    const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const status=(text,kind='')=>{$('status').textContent=text;$('status').className=kind};
    const request=async(url,options)=>{const r=await fetch(url,options),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Ошибка запроса.');return b};
    const company=()=>state.content[state.company],project=()=>company()?.Projects?.[state.project];
    const newProject=()=>({Name:'Новый проект',Platform:[company()?.Name||'Компания'],Description:'',ImageUrl:'',VideoUrls:[],ScreenUrls:[],ProjectUrl:''});
    const newCompany=()=>({StartDate:'',EndDate:'',FullDescription:'',CompanyUrl:'',JobType:'',Name:'Новая компания',LogoUrl:'',Description:'',Projects:[]});
    function normalize(){state.content.forEach(c=>{['StartDate','EndDate','FullDescription','CompanyUrl','JobType','Name','LogoUrl','Description'].forEach(k=>c[k]??='');c.Projects??=[];c.Projects.forEach(p=>{['Name','Description','ImageUrl','ProjectUrl'].forEach(k=>p[k]??='');['Platform','VideoUrls','ScreenUrls'].forEach(k=>p[k]??=[]);})})}
    const field=(label,key,value,scope,area=false,hint='')=>`<label>${label}${hint?`<span class="hint">${hint}</span>`:''}${area?`<textarea data-scope="${scope}" data-field="${key}">${esc(value)}</textarea>`:`<input data-scope="${scope}" data-field="${key}" value="${esc(value)}">`}</label>`;
    const arrayField=(label,key,values)=>`<label>${label}<span class="hint">Добавляйте по одной ссылке или метке.</span><div class="array">${values.map((v,i)=>`<div class="array-row"><input data-scope="project-array" data-list="${key}" data-index="${i}" value="${esc(v)}"><button class="icon danger" data-action="remove-array" data-list="${key}" data-index="${i}" title="Удалить">×</button></div>`).join('')}</div><button class="secondary" data-action="add-array" data-list="${key}" type="button">+ Добавить</button></label>`;
    function renderCompanies(){$('companies').innerHTML=state.content.map((c,i)=>`<button data-action="select-company" data-index="${i}" class="${i===state.company?'active':''}">${esc(c.Name||'Без названия')}<span class="small">${esc(c.StartDate||'Без даты')} · ${c.Projects.length} проектов</span></button>`).join('')}
    function renderForm(){const c=company();if(!c){$('form').innerHTML='<h2>Добавьте первую компанию</h2>';return}const p=project();$('form').innerHTML=`<div class="tabs"><button class="${state.tab==='company'?'active':''}" data-action="show-company">Компания</button><button class="${state.tab==='project'?'active':''}" data-action="show-project">Проекты (${c.Projects.length})</button></div><div id="company-fields" class="stack" ${state.tab==='company'?'':'hidden'}><h2>Компания</h2><div class="grid">${field('Название','Name',c.Name,'company')}${field('Тип работы','JobType',c.JobType,'company')}</div><div class="grid">${field('Дата начала','StartDate',c.StartDate,'company',false,'Например: 2023-07')}${field('Дата окончания','EndDate',c.EndDate,'company',false,'Или Present')}</div>${field('Короткое описание','Description',c.Description,'company',true)}${field('Полное описание','FullDescription',c.FullDescription,'company',true)}${field('Ссылка на компанию','CompanyUrl',c.CompanyUrl,'company')}${field('Ссылка на логотип','LogoUrl',c.LogoUrl,'company')}<div class="actions"><button class="danger" data-action="delete-company">Удалить компанию</button><button class="secondary" data-action="move-company" data-direction="-1">↑</button><button class="secondary" data-action="move-company" data-direction="1">↓</button></div></div><div id="project-fields" class="stack" ${state.tab==='project'?'':'hidden'}><div class="tabs">${c.Projects.map((p,i)=>`<button data-action="select-project" data-index="${i}" class="${i===state.project?'active':''}">${esc(p.Name||`Проект ${i+1}`)}</button>`).join('')}<button data-action="add-project">+ Проект</button></div>${p?`<h2>Проект</h2>${field('Название','Name',p.Name,'project')}${field('Описание','Description',p.Description,'project',true)}${field('Ссылка на иконку / обложку','ImageUrl',p.ImageUrl,'project')}${field('Ссылка на проект','ProjectUrl',p.ProjectUrl,'project')}${arrayField('Платформы и метки','Platform',p.Platform)}${arrayField('Видео (URL)','VideoUrls',p.VideoUrls)}${arrayField('Скриншоты (URL)','ScreenUrls',p.ScreenUrls)}<div class="actions"><button class="danger" data-action="delete-project">Удалить проект</button><button class="secondary" data-action="move-project" data-direction="-1">↑</button><button class="secondary" data-action="move-project" data-direction="1">↓</button></div>`:'<p>В компании пока нет проектов.</p>'}</div>`}
    function renderPreview(){const c=company(),p=project();if(!c){$('preview').innerHTML='<h2>Предпросмотр</h2><p>Нет данных.</p>';return}const logo=c.LogoUrl?`<img class="preview-logo" src="${esc(c.LogoUrl)}" onerror="this.style.visibility='hidden'">`:'<div class="preview-logo"></div>';$('preview').innerHTML=`<h2>Предпросмотр</h2><div class="preview-hero">${logo}<div><h3>${esc(c.Name||'Без названия')}</h3><p>${esc(c.JobType||'')}</p></div></div><p>${esc(c.Description||'Короткое описание компании появится здесь.')}</p>${p?`<div class="project-preview"><h3>${esc(p.Name||'Без названия')}</h3>${p.ImageUrl?`<img class="cover" src="${esc(p.ImageUrl)}" onerror="this.style.display='none'">`:''}<p>${esc(p.Description||'Описание проекта')}</p><div class="badges">${p.Platform.map(tag=>`<span class="badge">${esc(tag)}</span>`).join('')}</div>${p.ScreenUrls.length?`<div class="screens">${p.ScreenUrls.map(url=>`<img src="${esc(url)}" onerror="this.style.display='none'">`).join('')}</div>`:''}<p class="hint">Видео: ${p.VideoUrls.length} · Скриншоты: ${p.ScreenUrls.length}</p></div>`:''}`}
    function render(){normalize();state.company=Math.max(0,Math.min(state.company,state.content.length-1));state.project=Math.max(0,Math.min(state.project,(company()?.Projects.length||1)-1));renderCompanies();renderForm();renderPreview()}
    function swap(list,i,d){const j=i+d;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]]}
    async function load(){state.content=await request('/api/configure/content');normalize();$('login-panel').hidden=true;$('editor').hidden=false;$('save').hidden=false;$('logout').hidden=false;render()}
    $('login-form').addEventListener('submit',async e=>{e.preventDefault();try{await request('/api/configure/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';await load();status('Вход выполнен.','success')}catch(e){status(e.message,'error')}})
    document.addEventListener('input',e=>{const el=e.target,c=company(),p=project();if(el.dataset.scope==='company')c[el.dataset.field]=el.value;if(el.dataset.scope==='project'&&p)p[el.dataset.field]=el.value;if(el.dataset.scope==='project-array'&&p)p[el.dataset.list][Number(el.dataset.index)]=el.value;if(el.dataset.scope)renderPreview()})
    document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,c=company();if(a==='select-company'){state.company=Number(b.dataset.index);state.project=0;state.tab='company'}if(a==='add-company'){state.content.push(newCompany());state.company=state.content.length-1;state.project=0;state.tab='company'}if(a==='delete-company'&&confirm(`Удалить «${c.Name}» вместе с проектами?`)){state.content.splice(state.company,1);state.company=0;state.project=0;state.tab='company'}if(a==='move-company'){swap(state.content,state.company,Number(b.dataset.direction));state.company+=Number(b.dataset.direction)}if(a==='show-company'){state.tab='company';render();return}if(a==='show-project'){state.tab='project';render();return}if(a==='select-project')state.project=Number(b.dataset.index);if(a==='add-project'){c.Projects.push(newProject());state.project=c.Projects.length-1;state.tab='project'}if(a==='delete-project'&&confirm(`Удалить «${project().Name}»?`)){c.Projects.splice(state.project,1);state.project=0}if(a==='move-project'){swap(c.Projects,state.project,Number(b.dataset.direction));state.project+=Number(b.dataset.direction)}if(a==='add-array')project()[b.dataset.list].push('');if(a==='remove-array')project()[b.dataset.list].splice(Number(b.dataset.index),1);render()})
    $('save').addEventListener('click',async()=>{try{$('save').disabled=true;await request('/api/configure/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.content)});status('Сохранено. Публичный сайт уже использует новую версию.','success')}catch(e){status(e.message,'error')}finally{$('save').disabled=false}})
    $('logout').addEventListener('click',async()=>{await request('/api/configure/logout',{method:'POST'});location.reload()});request('/api/configure/session').then(({authenticated})=>{if(authenticated)load()}).catch(e=>status(e.message,'error'));
  </script>
</body>
</html>
